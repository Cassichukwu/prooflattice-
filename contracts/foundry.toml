[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

fs_permissions = [{ access = "read-write", path = "../deploy" }]

[profile.default.rpc_endpoints]
mantle_sepolia = "${MANTLE_SEPOLIA_RPC_URL}"
mantle_mainnet = "${MANTLE_MAINNET_RPC_URL}"

[profile.default.etherscan]
mantle_sepolia = { key = "${MANTLESCAN_API_KEY}", url = "https://sepolia.mantlescan.org/api" }
mantle_mainnet = { key = "${MANTLESCAN_API_KEY}", url = "https://mantlescan.org/api" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
